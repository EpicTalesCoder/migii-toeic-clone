                body {
                    font-size: <font_size>;

                    line-height: 2em;
                    letter-spacing: 0px;
                }
                .explain span, .explain p, .explain b, .explain strong {
                    word-break: break-word;
                    font-size: <font_size>!important;

                    letter-spacing: 0px!important;
                }
                .question span, .question p, .question b, .question strong {

                }
                .questionMulti span, .questionMulti p, .questionMulti b, .questionMulti strong, .questionMulti {

                span.dicWin {
                    border-bottom: 2px solid rgb(0,145,234);
                }
            
            </style>
            </head>
    <body>
        <news_body>
            <script type="text/javascript">
                function setupWKWebViewJavascriptBridge(callback) {
                    if (window.WKWebViewJavascriptBridge) { return callback(WKWebViewJavascriptBridge); }
                    if (window.WKWVJBCallbacks) { return window.WKWVJBCallbacks.push(callback); }
                    window.WKWVJBCallbacks = [callback];
                    window.webkit.messageHandlers.iOS_Native_InjectJavascript.postMessage(null)
                }
            
                setupWKWebViewJavascriptBridge(function(bridge) {
                    var dictWins = document.getElementsByClassName("dicWin");
                    for (var i = 0; i < dictWins.length; i++) {
                        dictWins[i].addEventListener("click", function (e) {
                            var contentHtml = e.currentTarget.innerHTML.trim();
                            if (contentHtml != '') {
                                bridge.callHandler("onHighlightClicked", {'content': contentHtml}, null);
                            }
                        });
                    }
                    
                    var questionAnswers = document.getElementsByClassName("question-answer");
                    for (var i = 0; i < questionAnswers.length; i++) {
                        questionAnswers[i].addEventListener("click", function (e) {
                            var contentHtml = this.dataset.id;
                            if (contentHtml != '') {
                                bridge.callHandler("onAnswerChoose", {'content': contentHtml}, null);
                            }
                        });
                    }
                });
                
                document.addEventListener('selectionchange', function() {
                    var range, content = '', rect;
                    if (document.selection && document.selection.createRange) {
                        content = range.htmlText;
                    } else if (window.getSelection) {
                        var selection = window.getSelection();
                        if (selection.rangeCount > 0) {
                            range = selection.getRangeAt(0);
                            rect = range.getBoundingClientRect();
                            var clonedSelection = range.cloneContents();
                            var div = document.createElement('div');
                            div.appendChild(clonedSelection);
                            content = div.innerHTML;
                        }
                    }
                    content = content.replace(/<.*?>/g, "").trim();
                    WKWebViewJavascriptBridge.callHandler("onSelectionChange", {'content': content,'rect':rect}, null);
                })
                
                function image(img) {
                    var src = img.alt;
                    WKWebViewJavascriptBridge.callHandler("onImageClick", {'image': src}, null);
                }

       </script>
    </body>
</html>
